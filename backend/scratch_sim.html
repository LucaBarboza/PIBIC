<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Visualizador de Padrões de Não-Linearidade</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script></head><body class="bg-slate-50 p-4 md:p-6 font-sans"><div class="max-w-4xl mx-auto bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6"><div class="text-center"><h2 class="text-xl font-bold text-slate-800 mb-1">Visualizador de Padrões de Não-Linearidade</h2><p class="text-xs text-slate-500">Laboratório Interativo Virtual | Diagnóstico Gráfico dos Resíduos</p></div><div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4"><div class="grid grid-cols-5 items-center gap-4"><label for="curvatura" class="col-span-1 text-sm font-medium text-slate-700">Curvatura</label><input id="curvatura" type="range" min="-1" max="1" value="0.7" step="0.05" class="col-span-3 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"><span id="curvatura-valor" class="col-span-1 text-center text-sm font-mono text-slate-600 bg-white rounded-md px-2 py-1 border border-slate-200 shadow-sm">0.70</span></div><div class="grid grid-cols-5 items-center gap-4"><label for="ruido" class="col-span-1 text-sm font-medium text-slate-700">Ruído</label><input id="ruido" type="range" min="0" max="1" value="0.3" step="0.05" class="col-span-3 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"><span id="ruido-valor" class="col-span-1 text-center text-sm font-mono text-slate-600 bg-white rounded-md px-2 py-1 border border-slate-200 shadow-sm">0.30</span></div><div class="grid grid-cols-5 items-center gap-4"><label for="pontos" class="col-span-1 text-sm font-medium text-slate-700">Nº de Pontos</label><input id="pontos" type="range" min="50" max="300" value="150" step="10" class="col-span-3 h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600"><span id="pontos-valor" class="col-span-1 text-center text-sm font-mono text-slate-600 bg-white rounded-md px-2 py-1 border border-slate-200 shadow-sm">150</span></div></div><div id="grafico" class="w-full my-4" style="width: 100%; min-height: 420px; height: 450px;"></div></div><script>const curvaturaSlider = document.getElementById('curvatura');const ruidoSlider = document.getElementById('ruido');const pontosSlider = document.getElementById('pontos');const curvaturaValor = document.getElementById('curvatura-valor');const ruidoValor = document.getElementById('ruido-valor');const pontosValor = document.getElementById('pontos-valor');function generateData(curvatura, ruido, n) {const y_hat = [];const residuos = [];const curvatura_offset = curvatura / 3.0;for (let i = 0; i < n; i++) {const x = -1 + (2 * i) / (n - 1);y_hat.push(x);const systematic_part = (curvatura * x * x) - curvatura_offset;const random_part = ruido * (Math.random() - 0.5) * 2;residuos.push(systematic_part + random_part);}return { x: y_hat, y: residuos };}function updateChart() {const curvatura = parseFloat(curvaturaSlider.value);const ruido = parseFloat(ruidoSlider.value);const n = parseInt(pontosSlider.value);curvaturaValor.textContent = curvatura.toFixed(2);ruidoValor.textContent = ruido.toFixed(2);pontosValor.textContent = n;const plotData = generateData(curvatura, ruido, n);const traceResiduos = {x: plotData.x,y: plotData.y,mode: 'markers',type: 'scatter',name: 'Resíduos',marker: {color: 'rgb(30, 64, 175)',size: 6,opacity: 0.7}};const traceZeroLine = {x: [-1.1, 1.1],y: [0, 0],mode: 'lines',type: 'scatter',name: 'Referência',line: {color: 'rgb(220, 38, 38)',width: 2,dash: 'dash'}};const data = [traceResiduos, traceZeroLine];const layout = {xaxis: {title: "",range: [-1.1, 1.1],gridcolor: '#e5e7eb',zeroline: false},yaxis: {title: "",gridcolor: '#e5e7eb',zeroline: false,autorange: true},showlegend: false,margin: { t: 20, b: 60, l: 60, r: 30 },autosize: true};Plotly.react('grafico', data, layout, { responsive: true, displayModeBar: false });if (window.parent) {window.parent.postMessage({ type: 'resize', height: document.body.scrollHeight + 40 }, '*');}}curvaturaSlider.addEventListener('input', updateChart);ruidoSlider.addEventListener('input', updateChart);pontosSlider.addEventListener('input', updateChart);function initialize() { updateChart(); }document.addEventListener('DOMContentLoaded', initialize);window.addEventListener('load', initialize);initialize();</script></body></html>
