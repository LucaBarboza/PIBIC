<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Analisador Comparativo com Boxplots Paralelos</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script><style>input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; background: #334155; border-radius: 50%; cursor: pointer; } input[type=range]::-moz-range-thumb { width: 16px; height: 16px; background: #334155; border-radius: 50%; cursor: pointer; }</style></head><body class="bg-slate-50 p-4 md:p-6 font-sans"><div class="max-w-4xl mx-auto bg-white rounded-2xl p-6 shadow-sm border border-slate-200 space-y-6"><div class="text-center"><h2 class="text-xl font-bold text-slate-800 mb-1">Analisador Comparativo com Boxplots Paralelos</h2><p class="text-xs text-slate-500">Laboratório Interativo Virtual | Gráficos e Boxplots</p></div><div class="bg-slate-100 p-4 rounded-xl border border-slate-200"><div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6"><div class="space-y-4"><h3 class="font-semibold text-slate-700 border-b border-slate-300 pb-1">Grupo A</h3><div><label for="mediaA" class="text-sm font-medium text-slate-600 flex justify-between"><span>Média</span><span id="valorMediaA" class="font-bold bg-white px-2 py-0.5 rounded-md text-slate-800">50</span></label><input type="range" id="mediaA" min="10" max="90" value="50" step="1" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"></div><div><label for="desvioA" class="text-sm font-medium text-slate-600 flex justify-between"><span>Dispersão (Desvio Padrão)</span><span id="valorDesvioA" class="font-bold bg-white px-2 py-0.5 rounded-md text-slate-800">10</span></label><input type="range" id="desvioA" min="1" max="30" value="10" step="1" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"></div><div><label for="amostrasA" class="text-sm font-medium text-slate-600 flex justify-between"><span>Nº de Amostras</span><span id="valorAmostrasA" class="font-bold bg-white px-2 py-0.5 rounded-md text-slate-800">100</span></label><input type="range" id="amostrasA" min="10" max="500" value="100" step="10" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"></div></div><div class="space-y-4"><h3 class="font-semibold text-slate-700 border-b border-slate-300 pb-1">Grupo B</h3><div><label for="mediaB" class="text-sm font-medium text-slate-600 flex justify-between"><span>Média</span><span id="valorMediaB" class="font-bold bg-white px-2 py-0.5 rounded-md text-slate-800">60</span></label><input type="range" id="mediaB" min="10" max="90" value="60" step="1" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"></div><div><label for="desvioB" class="text-sm font-medium text-slate-600 flex justify-between"><span>Dispersão (Desvio Padrão)</span><span id="valorDesvioB" class="font-bold bg-white px-2 py-0.5 rounded-md text-slate-800">15</span></label><input type="range" id="desvioB" min="1" max="30" value="15" step="1" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"></div><div><label for="amostrasB" class="text-sm font-medium text-slate-600 flex justify-between"><span>Nº de Amostras</span><span id="valorAmostrasB" class="font-bold bg-white px-2 py-0.5 rounded-md text-slate-800">100</span></label><input type="range" id="amostrasB" min="10" max="500" value="100" step="10" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"></div></div></div></div><div id="grafico" class="w-full my-4" style="width: 100%; min-height: 420px; height: 450px;"></div><div class="text-center text-xs text-slate-400 mt-4"><p>Use os controles para ajustar a média, a dispersão e o tamanho da amostra de cada grupo e observe o impacto nos boxplots.</p></div></div><script>document.addEventListener('DOMContentLoaded', () => { const graficoDiv = document.getElementById('grafico'); const sliders = { mediaA: document.getElementById('mediaA'), desvioA: document.getElementById('desvioA'), amostrasA: document.getElementById('amostrasA'), mediaB: document.getElementById('mediaB'), desvioB: document.getElementById('desvioB'), amostrasB: document.getElementById('amostrasB') }; const valores = { mediaA: document.getElementById('valorMediaA'), desvioA: document.getElementById('valorDesvioA'), amostrasA: document.getElementById('valorAmostrasA'), mediaB: document.getElementById('valorMediaB'), desvioB: document.getElementById('valorDesvioB'), amostrasB: document.getElementById('valorAmostrasB') }; let isFirstPlot = true; function generateNormalData(mean, stdDev, n) { const data = []; for (let i = 0; i < n; i++) { let u = 0, v = 0; while (u === 0) u = Math.random(); while (v === 0) v = Math.random(); let num = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v); data.push(mean + num * stdDev); } return data; } function updateChart() { const paramsA = { media: parseFloat(sliders.mediaA.value), desvio: parseFloat(sliders.desvioA.value), amostras: parseInt(sliders.amostrasA.value) }; const paramsB = { media: parseFloat(sliders.mediaB.value), desvio: parseFloat(sliders.desvioB.value), amostras: parseInt(sliders.amostrasB.value) }; valores.mediaA.textContent = paramsA.media; valores.desvioA.textContent = paramsA.desvio; valores.amostrasA.textContent = paramsA.amostras; valores.mediaB.textContent = paramsB.media; valores.desvioB.textContent = paramsB.desvio; valores.amostrasB.textContent = paramsB.amostras; const dataA = generateNormalData(paramsA.media, paramsA.desvio, paramsA.amostras); const dataB = generateNormalData(paramsB.media, paramsB.desvio, paramsB.amostras); const traces = [ { y: dataA, type: 'box', name: 'Grupo A', marker: { color: 'rgb(59, 130, 246)' }, boxpoints: 'Outliers' }, { y: dataB, type: 'box', name: 'Grupo B', marker: { color: 'rgb(239, 68, 68)' }, boxpoints: 'Outliers' } ]; const layout = { title: { text: '' }, yaxis: { title: "", zeroline: false, range: [0, 120] }, xaxis: { zeroline: false }, autosize: true, margin: { t: 20, b: 60, l: 50, r: 30 }, showlegend: true, legend: { orientation: 'h', x: 0.5, xanchor: 'center', y: -0.2 } }; const config = { responsive: true, displayModeBar: false }; if (isFirstPlot) { Plotly.newPlot(graficoDiv, traces, layout, config); isFirstPlot = false; } else { Plotly.react(graficoDiv, traces, layout, config); } if (window.parent) { window.parent.postMessage({ type: 'resize', height: document.body.scrollHeight + 40 }, '*'); } } Object.values(sliders).forEach(slider => { slider.addEventListener('input', updateChart); }); updateChart(); });</script></body></html>
